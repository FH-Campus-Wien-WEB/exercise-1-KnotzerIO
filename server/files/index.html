<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies!</title>
    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        header {
            border-bottom: 1px solid #333;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .github-link {
            display: flex;
            align-items: center;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .github-link svg {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            fill: #fff;
        }

        img {
            border-radius: 16px;
            border: 1px solid #333;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
        }

        article {
            display: flex;
            gap: 16px;
            padding: 16px;
            margin: 16px;
            border: 1px solid #333;
            border-radius: 16px;
        }

        .genre {
            display: inline-block;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 8px;
            margin-right: 4px;
            margin-top: 4px;
        }
    </style>
    <script>
        function reverseString(s) {
            return s.split("").reverse().join("");
        }

        window.onload = function () {
            const xhr = new XMLHttpRequest()
            xhr.onload = function () {
                const bodyElement = document.querySelector("main")
                if (xhr.status == 200) {
                    movies = JSON.parse(xhr.responseText)
                    movies.forEach(movie => {
                        const movieEl = document.createElement("div")

                        movieEl.innerHTML = `
                        <article>
                        <img src="${movie.Poster}" alt="${movie.Title}">
                        <div>
                            <h3>${movie.Title}</h3>
                            <p>Runtime: ${movie.Runtime}</p>
                            <p>Released: ${movie.Released}</p>
                            <div>
                                ${movie.Genres.map(genre => `<span class="genre">${genre}</span>`).join('')}
                            </div>
                            <p>${movie.Plot}</p>
                            <h4>Director</h4>
                            <ul>
                                ${movie.Directors.map(director => `<li>${director}</li>`).join('')}
                            </ul>
                            <h4>Writers</h4>
                            <ul>
                                ${movie.Writers.map(writer => `<li>${writer}</li>`).join('')}
                            </ul>
                            <h4>Actors</h4>
                            <ul>
                                ${movie.Actors.map(actor => `<li>${actor}</li>`).join('')}
                            </ul>
                        </div>
                        </article>
                        `;
                        bodyElement.append(movieEl)
                    })

                } else {
                    bodyElement.append("Daten konnten nicht geladen werden, Status " + xhr.status + " - " + xhr.statusText)
                }
            }
            xhr.open("GET", "/movies")
            xhr.send()
        }
    </script>

</head>
